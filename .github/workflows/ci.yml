name: ci
on:
  push:
  pull_request:
  # Lets the optional `aab` job below (release/publication build) be
  # triggered manually from the Actions tab — "Run workflow". Adding this
  # trigger does not change when the four jobs above run: they still only
  # fire on push/pull_request, exactly as before.
  workflow_dispatch:
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
  apk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      # Building both the debug and release APK back-to-back (below) filled
      # the runner's disk entirely (the runner's own diagnostic logging
      # failed with ENOSPC) once the release build was added — the
      # preinstalled toolchains this job never uses (.NET, Haskell, CodeQL)
      # are the biggest safely-removable chunks on a stock ubuntu-latest
      # runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-java@v4
        # maplibre_gl 0.27.0 sets compileOptions.sourceCompatibility to Java 21;
        # a JDK 17 toolchain fails javac with "invalid source release: 21".
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: randomwalk-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      # No key.properties on CI (see docs/release-signing.md) — this exercises
      # the release build's signing fallback path (debug-signing substitution)
      # rather than producing a distributable artifact, so it runs after the
      # debug APK is already uploaded and only the debug APK above is kept.
      - run: flutter build apk --release
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        # see the apk job: maplibre_gl 0.27.0 requires a Java 21 toolchain.
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Two-attempt pattern: GitHub-hosted runners intermittently kill this
      # job BEFORE any test runs (corrupt emulator SDK download, "adb:
      # device offline" at boot) — ~1 run in 3 some nights. A second
      # attempt boots a fresh emulator; a genuine test failure fails both
      # attempts and the job stays red.
      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator-attempt-1
        continue-on-error: true
        with:
          api-level: 34
          arch: x86_64
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/routing_test.dart
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.emulator-attempt-1.outcome == 'failure'
        with:
          api-level: 34
          arch: x86_64
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/routing_test.dart
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r server/leaderboard/requirements.txt
      - run: python -m pytest server/leaderboard -v
  # Optional publication build (M5 Task 7). workflow_dispatch ONLY — never
  # runs on push/pull_request (see the `on:` block above), so it can never
  # turn the push-triggered CI gate red. Meant to be run by hand from the
  # Actions tab once a release AAB is wanted.
  #
  # Signs with the real upload keystore when the four ANDROID_* secrets
  # below are configured (Settings -> Secrets and variables -> Actions),
  # otherwise falls back to the Flutter DEBUG keystore automatically (same
  # fallback build.gradle.kts already does locally — see
  # docs/release-signing.md) and says so loudly in the log. Either way the
  # job succeeds and uploads whatever AAB it produced, so a debug-signed
  # trial build is still useful for local installs/testing; only a
  # real-secrets run produces something installable as a Play Console
  # update.
  #
  # SUPABASE_URL/SUPABASE_ANON_KEY are also optional secrets: if unset, the
  # dart-defines below evaluate to empty strings, which
  # SupabaseConfig.fromEnvironment() treats as "unconfigured" (see
  # app/lib/sync/config.dart) — the exact same M4-identical local-only
  # build every other CI job already produces, just as an AAB instead of an
  # APK.
  aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        # see the apk job: maplibre_gl 0.27.0 requires a Java 21 toolchain.
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - name: Configure release signing (if secrets are present)
        # Secrets are passed via env (not interpolated directly into the
        # script) so an unusual character in a password can never break the
        # heredoc or get interpreted by the shell.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
            # storeFile MUST be an absolute path here, not a bare filename.
            # android/app/build.gradle.kts reads key.properties (found via
            # rootProject.file("key.properties"), i.e. android/key.properties)
            # but resolves storeFile with a bare `file(it)` call, which
            # Gradle evaluates against the CURRENT project — the :app module,
            # i.e. android/app/ — not against android/ where key.properties
            # itself lives and where this step wrote the keystore. A relative
            # "upload-keystore.jks" would therefore resolve one directory
            # off (android/app/upload-keystore.jks, which doesn't exist) and
            # fail the signed build. This is exactly why the real local
            # key.properties (docs/release-signing.md) also uses an absolute
            # path rather than a relative one. $GITHUB_WORKSPACE is the
            # absolute checkout root on every GitHub-hosted runner.
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/app/android/upload-keystore.jks"
            } > android/key.properties
            echo "Signing secrets found — building a REAL signed AAB with the upload key."
          else
            echo "WARNING: no ANDROID_KEYSTORE_BASE64/ANDROID_STORE_PASSWORD/ANDROID_KEY_PASSWORD/ANDROID_KEY_ALIAS secrets configured — building an AAB signed with the Flutter DEBUG keystore (build.gradle.kts's existing fallback). This artifact is NOT suitable for upload to the Play Console. See docs/release-signing.md to configure real signing secrets."
          fi
      - name: Build AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: randomwalk-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
