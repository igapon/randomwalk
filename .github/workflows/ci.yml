name: ci
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  apk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      # Building both the debug and release APK back-to-back (below) filled
      # the runner's disk entirely (the runner's own diagnostic logging
      # failed with ENOSPC) once the release build was added — the
      # preinstalled toolchains this job never uses (.NET, Haskell, CodeQL)
      # are the biggest safely-removable chunks on a stock ubuntu-latest
      # runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-java@v4
        # maplibre_gl 0.27.0 sets compileOptions.sourceCompatibility to Java 21;
        # a JDK 17 toolchain fails javac with "invalid source release: 21".
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: randomwalk-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      # No key.properties on CI (see docs/release-signing.md) — this exercises
      # the release build's signing fallback path (debug-signing substitution)
      # rather than producing a distributable artifact, so it runs after the
      # debug APK is already uploaded and only the debug APK above is kept.
      - run: flutter build apk --release
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        # see the apk job: maplibre_gl 0.27.0 requires a Java 21 toolchain.
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: app
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/routing_test.dart
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r server/leaderboard/requirements.txt
      - run: python -m pytest server/leaderboard -v
