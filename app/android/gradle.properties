org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# maplibre_gl 0.27.0's build.gradle only applies the Kotlin Gradle Plugin itself
# below AGP 9 (see its android/build.gradle); at/above AGP 9 (we pin 9.0.1 in
# settings.gradle.kts) it assumes AGP's built-in Kotlin support registers the
# `kotlin { }` extension instead. That assumption only holds when this flag is
# on, so leaving it false breaks `:maplibre_gl` with "Could not find method
# kotlin()" as soon as a real Gradle build (`flutter build apk`) runs.
android.builtInKotlin=true
